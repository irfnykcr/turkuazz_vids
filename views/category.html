<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURKUAZZ - Category</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-dark-bg text-white min-h-screen">
    <header></header>

    <div class="flex">
        <aside id="sidebar"></aside>

        <main class="flex-1 p-6">
            <div class="flex items-center justify-between mb-6">
                <nav id="breadcrumb" class="text-turkuazz text-lg"></nav>
                
                <div class="flex items-center space-x-2">
                    <span class="text-turkuazz text-sm">SORT BY:</span>
                    <select id="sortSelect" class="bg-dark-card border border-gray-600 rounded px-3 py-1 text-sm text-white focus:outline-none focus:border-turkuazz">
                        <option value="name">Name</option>
                        <option value="date">Date Added</option>
                        <option value="size">File Size</option>
                        <option value="duration">Duration</option>
                    </select>
                </div>
            </div>

            <section id="subCategoriesSection" class="mb-8 hidden">
                <h2 class="text-xl font-light mb-4 text-gray-300">Categories</h2>
                <div id="subCategoriesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4 mb-6"></div>
            </section>

            <section id="videosSection">
                <h2 id="videosTitle" class="text-xl font-light mb-4 text-gray-300">Videos</h2>
                <div id="videosGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
                
                <div id="emptyState" class="hidden text-center py-12">
                    <div class="text-gray-400 text-lg mb-4">No content found in this category</div>
                    <button onclick="window.location.href='index.html'" class="text-turkuazz hover:text-white transition-colors">
                        ← Back to Home
                    </button>
                </div>
                
                <div id="loadingState" class="text-center py-12">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-turkuazz mx-auto mb-4"></div>
                    <div class="text-gray-400">Loading content...</div>
                </div>
            </section>

            <div id="pagination" class="hidden flex justify-center items-center space-x-4 mt-8">
                <button id="prevPage" class="px-4 py-2 bg-dark-card border border-gray-600 rounded text-turkuazz hover:bg-dark-hover transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Previous
                </button>
                <span id="pageInfo" class="text-gray-400"></span>
                <button id="nextPage" class="px-4 py-2 bg-dark-card border border-gray-600 rounded text-turkuazz hover:bg-dark-hover transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </main>
    </div>

	<script src="../assets/js/headers/header.js"></script>
	<script src="../assets/js/headers/sidebar.js"></script>
    <script src="../assets/js/category.js"></script>
</body>
</html>
