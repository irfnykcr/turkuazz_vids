<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - TURKUAZZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="../assets/js/renewCache.js"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-dark-bg text-white min-h-screen">
    <header></header>
    
    <div class="flex">
        <aside id="sidebar"></aside>
        <main class="container mx-auto p-4">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-turkuazz mb-4">Search Results</h1>
                
                <div class="flex items-center space-x-4 mb-6">
                    <div class="flex-1">
                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="Search..." 
                                class="w-full bg-dark-card border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:border-turkuazz">
                            <button id="clearSearch" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button id="searchButton" class="bg-turkuazz hover:bg-turkuazz-dark text-dark-bg font-medium px-4 py-2 rounded-lg transition-colors">
                        Search
                    </button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label for="categoryFilter" class="block text-sm font-medium text-gray-400 mb-1">Category</label>
                        <select id="categoryFilter" class="w-full bg-dark-card border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-turkuazz">
                            <option value="all">All Categories</option>
                            <!-- dynamic -->
                        </select>
                    </div>
                    <div>
                        <label for="typeFilter" class="block text-sm font-medium text-gray-400 mb-1">Type</label>
                        <select id="typeFilter" class="w-full bg-dark-card border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-turkuazz">
                            <option value="all">All Types</option>
                            <!-- dynamic -->
                        </select>
                    </div>
                    <div>
                        <label for="sortBy" class="block text-sm font-medium text-gray-400 mb-1">Sort By</label>
                        <select id="sortBy" class="w-full bg-dark-card border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-turkuazz">
                            <option value="relevance">Relevance</option>
                            <option value="name">Name (A-Z)</option>
                            <option value="name-desc">Name (Z-A)</option>
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>
                    </div>
                </div>
            </div>

           <div id="loadingState" class="flex justify-center items-center py-8 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-turkuazz"></div>
            </div>

            <div id="noResultsState" class="text-center py-8 hidden">
                <svg class="w-16 h-16 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h2 class="text-xl font-semibold text-gray-400">No results found</h2>
                <p class="text-gray-500 mt-2">Try adjusting your search or filters</p>
            </div>

            <div id="searchResults" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-6"></div>

            <div id="paginationControls" class="flex justify-center items-center space-x-2 my-8 hidden">
                <button id="prevPageBtn" class="px-4 py-2 bg-dark-card border border-gray-700 rounded hover:bg-gray-800 disabled:opacity-50">Previous</button>
                <div id="pageIndicator" class="px-4 py-2">Page <span id="currentPage">1</span> of <span id="totalPages">1</span></div>
                <button id="nextPageBtn" class="px-4 py-2 bg-dark-card border border-gray-700 rounded hover:bg-gray-800 disabled:opacity-50">Next</button>
                <select id="itemsPerPage" class="ml-4 bg-dark-card border border-gray-600 rounded px-3 py-2 focus:outline-none focus:border-turkuazz">
                    <option value="12">12 per page</option>
                    <option value="24">24 per page</option>
                    <option value="48">48 per page</option>
                    <option value="96">96 per page</option>
                </select>
            </div>
        </main>
    </div>

    <script src="../assets/js/headers/header.js"></script>
    <script src="../assets/js/headers/sidebar.js"></script>
    <script src="../assets/js/search.js"></script>
</body>
</html>
